<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 300px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1a1a1a;
        color: #fff;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px 0;
      }
      .status {
        padding: 8px;
        border-radius: 6px;
        margin-bottom: 12px;
        font-size: 14px;
      }
      .status.logged-in {
        background: #065f46;
      }
      .status.logged-out {
        background: #7f1d1d;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font-size: 14px;
        cursor: pointer;
        margin-bottom: 8px;
      }
      button:hover {
        background: #1d4ed8;
      }
      .usage {
        font-size: 12px;
        color: #9ca3af;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <h1>LLMUtils</h1>
    <div id="status" class="status logged-out">Not logged in</div>
    <button id="loginBtn">Login to LLMUtils</button>
    <button id="dashboardBtn" style="display:none;">Open Dashboard</button>
    <div class="usage">
      <div>Daily Actions: <span id="usageCount">0</span>/3</div>
      <div class="upgrade-link" style="margin-top:8px;cursor:pointer;text-decoration:underline;">
        Upgrade to Pro for unlimited
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
